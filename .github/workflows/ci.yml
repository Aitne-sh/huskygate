name: CI

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          npm_config_build_from_source: better-sqlite3
      - run: npm run typecheck
      - name: Lint
        if: runner.os != 'Windows'
        run: npm run lint
      - run: npm run test
      - name: Verify npm package
        if: runner.os == 'Linux'
        run: |
          npm run build
          npm pack --dry-run 2>&1 | tee /tmp/pack-output.txt
          # Fail if package exceeds 2MB packed size
          size=$(grep 'package size' /tmp/pack-output.txt | grep -oE '[0-9.]+ [kKmM]B' | head -1)
          echo "Package size: $size"
